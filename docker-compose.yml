version: '3.8'

services:
  pipeline:
    build: .
    container_name: clipmind-pipeline
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.cache/whisper:/root/.cache/whisper
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=production

  search:
    build: .
    container_name: clipmind-search
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
      - ./.cache:/app/.cache
      - ./.cache/whisper:/root/.cache/whisper
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    entrypoint: ["npm", "run", "search", "--"]

  ui:
    build: .
    container_name: clipmind-ui
    ports:
      - "3456:3456"
    volumes:
      - ./videos:/app/videos
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3456
    command: ["npx", "tsx", "src/web/server.ts"]
